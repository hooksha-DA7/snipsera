name: Bug report
description: Something in Snipsera doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Issues are public.** Screenshots and recordings can include notifications, other apps and personal information, so review anything you attach and never post passwords, keys or private recordings.
  - type: input
    id: version
    attributes:
      label: Snipsera version
      description: Shown in Settings > About.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Microsoft Store
        - GitHub installer (EXE)
        - Portable ZIP
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings > System > About, for example Windows 11 24H2.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Alt+Shift+1
        2. Select an area
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Displays and scaling, other apps involved, or a redacted screenshot.
